<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEGA-TICTACTOE $$$</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;

        }
                .container {
            width: 90%;
            max-width: 400px;
            background-color: #1e1e1e;

            /* МЕНЯЕМ ОТСТУПЫ, ЧТОБЫ ВСЁ ПОДНЯЛОСЬ ВЫШЕ: */
            padding: 10px 25px;

            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            text-align: center;
            border: 1px solid #333;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 5px;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        #balance {
            font-size: 22px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(0,255,204,0.3);
        }
                #status {
            font-size: 14px;
            color: #00bcd4;
            min-height: 25px; /* Уменьшили высоту блока статуса с 40px до 25px */
            margin-bottom: 10px; /* Уменьшили отступ под статусом с 15px до 10px */
            font-weight: 500;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px; /* Уменьшили отступ под полем с 25px до 15px */

            /* ДЕЛАЕМ САМО ПОЛЕ ЧУТЬ КОМПАКТНЕЕ: */
            width: 48vmin; /* Было 55vmin */
            margin-left: auto;
            margin-right: auto;
        }
        .cell {
            background-color: #2a2a2a;
            border: 2px solid #3d3d3d;
            color: #ffffff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;

            /* ПОДГОНЯЕМ РАЗМЕР КЛЕТОК ПОД НОВОЕ ПОЛЕ: */
            height: 15vmin; /* Было 17vmin */
            font-size: 9vmin; /* Было 10vmin */
        }


        .cell:hover {
            background-color: #3a3a3a;
            border-color: #ffd700;
        }
        .shop-title {
            color: #da70d6;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 1px solid #da70d6;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }
        .shop-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .shop-btn {
            border: none;
            padding: 12px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shop-btn:active {
            transform: scale(0.95);
        }
        #shield-btn { background-color: #2e8b57; box-shadow: 0 4px 10px rgba(46,139,87,0.3); }
        #scanner-btn { background-color: #4682b4; box-shadow: 0 4px 10px rgba(70,130,180,0.3); }
        .shop-btn:disabled {
            background-color: #444444;
            color: #888888;
            box-shadow: none;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<!-- Панель переключения языков -->
<div class="language-switcher" style="margin-bottom: 15px; display: flex; gap: 8px; justify-content: center;">
    <button onclick="changeLanguage('ru')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">RU</button>
    <button onclick="changeLanguage('uk')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">UKR</button>
    <button onclick="changeLanguage('en')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">ENG</button>
    <button onclick="changeLanguage('de')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">DEU</button>
    <button onclick="changeLanguage('zh')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">CHN</button>
    <button onclick="changeLanguage('ja')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">JPN</button>
    <button onclick="changeLanguage('hin')" style="cursor:pointer; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555;">🇮🇳 HIN</button>



</div>

<!-- Кнопки смены режима игры -->
<div style="text-align: center; margin-bottom: 15px;">
    <button id="btn-day" onclick="setGameMode('day')" style="padding: 10px 20px; font-size: 16px; background-color: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;">☀️ День</button>
    <button id="btn-evening" onclick="setGameMode('evening')" style="padding: 10px 20px; font-size: 16px; background-color: #3f51b5; color: white; border: none; border-radius: 5px; cursor: pointer;">🌙 Романтический вечер</button>
</div>

<!-- Модальное окно для выбора и ввода желаний (вечером) -->
<div id="wish-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: #2a1b3d; padding: 25px; border-radius: 15px; border: 2px solid #e91e63; width: 90%; max-width: 360px; text-align: center; box-sizing: border-box;">
        <h3 id="wish-modal-title" style="color: #ff4081; margin-top: 0; font-size: 20px;">💖 Игра на желание 💖</h3>
        <p id="wish-modal-subtitle" style="color: #fff; font-size: 14px; margin-bottom: 15px;">Выбери или напиши желание, которое исполнит проигравший:</p>

        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
            <button id="wish-preset-1" onclick="selectPresetWish(this.innerText)" style="background: #3b2354; color: #fff; border: 1px solid #ff4081; padding: 8px; border-radius: 8px; cursor: pointer;">Помыть посуду 🍽️</button>
            <button id="wish-preset-2" onclick="selectPresetWish(this.innerText)" style="background: #3b2354; color: #fff; border: 1px solid #ff4081; padding: 8px; border-radius: 8px; cursor: pointer;">Сделать массаж 💆‍♂️</button>
            <button id="wish-preset-3" onclick="selectPresetWish(this.innerText)" style="background: #3b2354; color: #fff; border: 1px solid #ff4081; padding: 8px; border-radius: 8px; cursor: pointer;">Приготовить кофе ☕</button>
        </div>

        <input type="text" id="custom-wish" placeholder="Или впиши своё желание..." style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ff4081; margin-bottom: 15px; box-sizing: border-box;">

        <button id="btn-confirm-wish" onclick="confirmWish()" style="background: #e91e63; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 25px; cursor: pointer;">Подтвердить</button>
    </div>
</div>


<!-- Панель отображения текущего желания на кону -->
<div id="active-wish-panel" style="display: none; background: #e91e63; color: white; padding: 8px 15px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; font-size: 14px; box-shadow: 0 4px 10px rgba(233,30,99,0.3);">
    <span id="on-the-line-label">На кону:</span> <span id="current-game-wish">-</span>
</div>

<div class="container">
    <h1>MEGA-TICTACTOE $$$</h1>
    <div id="balance">💰 Твой баланс: 3.37$</div>
    <button id="modeBtn" onclick="toggleGameMode()" style="padding: 10px 20px; font-size: 16px; margin-bottom: 15px; cursor: pointer; background-color: #2e8b57; color: white; border: none; border-radius: 5px; font-weight: bold;">🤖 Режим: Против ИИ</button>
    <div id="status">✈️ Самолёт летит...</div>

    <div class="board" id="board">
        <button class="cell" onclick="makeMove(0,0)"></button>
        <button class="cell" onclick="makeMove(0,1)"></button>
        <button class="cell" onclick="makeMove(0,2)"></button>
        <button class="cell" onclick="makeMove(1,0)"></button>
        <button class="cell" onclick="makeMove(1,1)"></button>
        <button class="cell" onclick="makeMove(1,2)"></button>
        <button class="cell" onclick="makeMove(2,0)"></button>
        <button class="cell" onclick="makeMove(2,1)"></button>
        <button class="cell" onclick="makeMove(2,2)"></button>
    </div>

    <div class="shop-title">🛒 МАГАЗИН ДОП. ОПЦИЙ</div>
    <div class="shop-buttons">
        <button id="shield-btn" class="shop-btn" onclick="buyShield()">🛡️ Щит (0.50$)</button>
        <button id="scanner-btn" class="shop-btn" onclick="buyScanner()">🚩 Сканер (0.30$)</button>
    </div>
</div>
<script src="script.min.js" defer></script>

</body>
</html>
